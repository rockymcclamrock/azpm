name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: azpm.exe
          - os: ubuntu-latest
            rid: linux-x64
            bin: azpm
          - os: macos-latest
            rid: osx-arm64
            bin: azpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish src/Azpm -c Release -r ${{ matrix.rid }} -o out
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf "azpm-${{ matrix.rid }}.tar.gz" "${{ matrix.bin }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "azpm-${{ matrix.rid }}.tar.gz" > "azpm-${{ matrix.rid }}.tar.gz.sha256"
          else
            shasum -a 256 "azpm-${{ matrix.rid }}.tar.gz" > "azpm-${{ matrix.rid }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: azpm-${{ matrix.rid }}
          path: azpm-${{ matrix.rid }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Automated build for \`${{ github.ref_name }}\`. Early development — see PLAN.md."
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease";; esac
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "$notes" \
            $prerelease
