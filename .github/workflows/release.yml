name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: azpm.exe
          - os: ubuntu-latest
            rid: linux-x64
            bin: azpm
          - os: macos-latest
            rid: osx-arm64
            bin: azpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Azpm -c Release -r ${{ matrix.rid }} -o out -p:Version="$version"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf "azpm-${{ matrix.rid }}.tar.gz" "${{ matrix.bin }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "azpm-${{ matrix.rid }}.tar.gz" > "azpm-${{ matrix.rid }}.tar.gz.sha256"
          else
            shasum -a 256 "azpm-${{ matrix.rid }}.tar.gz" > "azpm-${{ matrix.rid }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: azpm-${{ matrix.rid }}
          path: azpm-${{ matrix.rid }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease";; esac
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "Prebuilt Native AOT binaries — \`win-x64\`, \`linux-x64\`, \`osx-arm64\`. Extract the tarball, verify against the \`.sha256\`, put \`azpm\` on your \`PATH\`. Pre-1.0: the CLI and on-disk formats may still change." \
            $prerelease
